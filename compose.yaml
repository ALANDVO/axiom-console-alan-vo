name: axiom-console

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: axiom-backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: "sqlite+aiosqlite:///./data/axiom.db"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - axiom_db:/app/data
    depends_on:
      keycloak:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health/ready', timeout=5).raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: axiom-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: axiom-keycloak
    restart: unless-stopped
    command: start-dev
    env_file: .env
    environment:
      KEYCLOAK_ADMIN: "${KEYCLOAK_ADMIN:-admin}"
      KEYCLOAK_ADMIN_PASSWORD: "${KEYCLOAK_ADMIN_PASSWORD:-admin}"
      KC_DB: sqlite
      KC_DB_DATABASE: /opt/keycloak/data/keycloak.db
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/realms/master"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 30s

volumes:
  axiom_db:
  keycloak_data: